<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c2434;background:#f5f6fa;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:#3c55b9}main{max-width:800px;margin:auto;padding:20px 16px 95px}.top{background:#171b27;color:white;padding:22px 18px 15px}.topin{max-width:800px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:800;font-size:23px;letter-spacing:-.7px}.subtitle{font-size:12px;color:#aeb7c9;margin-top:2px}.lang{display:flex;border:1px solid #454f60;border-radius:12px;overflow:hidden}.lang button{border:0;background:transparent;color:#e6eaf2;padding:9px 13px}.lang button.on{background:#eaf0ff;color:#222b45;font-weight:700}.nav{display:flex;gap:6px;max-width:800px;margin:14px auto 0;overflow:auto}.nav button{border:0;background:transparent;color:#afb8cc;padding:10px 13px;border-radius:11px;white-space:nowrap}.nav button.on{background:#3a4458;color:white;font-weight:700}h1{font-size:25px;margin:4px 0 18px;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0 0 6px}.card{background:white;padding:18px;border:1px solid #e8eaf0;border-radius:16px;box-shadow:0 3px 12px #212c4e09;margin:0 0 12px}.muted{color:#6c7587;font-size:13px}.tiny{font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.buttons{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid #d9dfea;background:white;color:#263351;border-radius:10px;padding:10px 13px;font-weight:650}.btn.primary{background:#333f99;color:#fff;border-color:#333f99}.btn.soft{background:#eef0fb;border-color:#eef0fb}.btn.danger{color:#b63d45;border-color:#f4d0d3}.btn.small{font-size:12px;padding:7px 9px}.field{display:block;margin:10px 0}.field span{display:block;font-size:12px;color:#687387;margin:0 0 6px}.input,select,textarea{border:1px solid #d6dce7;border-radius:10px;padding:11px 12px;background:white;color:#20283b;width:100%;min-width:0}textarea{min-height:68px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.line{border:0;border-top:1px solid #eceef4;margin:14px 0}.tag{display:inline-block;background:#edf0f8;border-radius:7px;color:#52617b;padding:4px 7px;font-size:11px}.empty{text-align:center;color:#768194;padding:32px 12px}.sethead,.setrow{display:grid;grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) 48px 32px;gap:6px;align-items:center;margin:8px 0}.sethead{font-size:11px;color:#657187;text-align:center}.setrow input{padding:9px 5px;text-align:center}.setrow label{text-align:center}.setrow.done{background:#f2fbf4;border-radius:9px;padding:3px}.circle{border:0;background:transparent;font-size:21px;color:#2c8c54;padding:5px}.remove{border:0;background:none;color:#aa5a61;font-size:19px}.exercise-title{font-weight:750}.historyset{font-size:13px;color:#515d70;line-height:1.7}.help{margin-top:10px;font-size:12px;color:#667287}.pill{padding:5px 8px;background:#edf5ee;color:#277947;border-radius:8px;font-size:11px}.spacer{height:14px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffeb;border-top:1px solid #eceef4;padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.bottomin{max-width:800px;margin:auto}.bottom button{width:100%} .hide{display:none} .error{color:#a42737;font-size:13px} :focus-visible{outline:3px solid #8da0ff;outline-offset:2px}@media(max-width:420px){.card{padding:14px}.btn{padding:9px}.nav button{padding:9px}.sethead,.setrow{grid-template-columns:29px minmax(0,1fr) minmax(0,1fr) 37px 24px;gap:4px}}
</style></head><body>
<header class="top"><div class="topin"><div><div class="brand">WORKOUT LOG</div><div class="subtitle">Lift · Track · Repeat</div></div><div class="lang"><button id="zh" onclick="switchLang('zh')">中文</button><button id="en" onclick="switchLang('en')">EN</button></div></div><nav class="nav" id="nav"></nav></header><main id="app"></main><div id="bottom" class="bottom hide"><div class="bottomin"><button class="btn primary" id="saveworkout"></button></div></div><input id="importFile" type="file" accept="application/json,.json" hidden><script>
"use strict";
const KEY="bilingual-workout-v1";
const seed=[
["Romanian Deadlift","罗马尼亚硬拉","legs","RDL"],
["Barbell Hip Thrust","杠铃臀推","glutes","Hip Thrust"],
["Barbell Squat","杠铃深蹲","legs","Squat"],
["Goblet Squat","高脚杯深蹲","legs",""],
["Bulgarian Split Squat","保加利亚分腿蹲","legs",""],
["Leg Press","腿举","legs",""],
["Leg Extension","腿屈伸","legs",""],
["Seated Leg Curl","坐姿腿弯举","legs",""],
["Walking Lunge","行走弓步蹲","legs",""],
["Cable Kickback","绳索后踢腿","glutes",""],
["Hip Abduction","髋外展","glutes",""],
["Glute Bridge","臀桥","glutes",""],
["Lat Pulldown","高位下拉","back",""],
["Seated Cable Row","坐姿绳索划船","back",""],
["Assisted Pull-up","辅助引体向上","back",""],
["Dumbbell Row","哑铃划船","back",""],
["Face Pull","面拉","shoulders",""],
["Bench Press","卧推","chest",""],
["Incline Dumbbell Press","上斜哑铃卧推","chest",""],
["Push-up","俯卧撑","chest",""],
["Dumbbell Shoulder Press","哑铃肩推","shoulders",""],
["Lateral Raise","侧平举","shoulders",""],
["Biceps Curl","二头弯举","arms",""],
["Triceps Pushdown","三头下压","arms",""],
["Plank","平板支撑","core",""],
["Dead Bug","死虫式","core",""]
].map((x,i)=>({id:"seed-"+i,name_en:x[0],name_zh:x[1],muscle_group:x[2],aliases:x[3]?[x[3]]:[],tutorial_url:"",notes:"",archived:false}));
const dict={
zh:{workout:"训练",exercises:"动作库",templates:"训练模板",history:"历史",settings:"设置",start:"开始训练",startBlank:"空白训练",fromTemplate:"从模板开始",active:"进行中的训练",addExercise:"添加动作",addSet:"添加一组",finish:"完成并保存",weight:"重量 kg",reps:"次数",set:"组",last:"上次",tutorial:"教程 ↗",edit:"编辑",archive:"归档",newExercise:"新建动作",newTemplate:"新建模板",name:"名称",search:"搜索中文、英文或别名",group:"肌群",all:"全部",save:"保存",cancel:"取消",delete:"删除",copy:"复制",none:"暂无记录",empty:"还没有训练记录",import:"导入 JSON",export:"导出 JSON",local:"数据只保存在当前浏览器。请定期导出备份；不同设备不会自动同步。",notFound:"找不到动作",custom:"自定义训练",confirmDelete:"确认删除？",discard:"放弃当前训练",continue:"继续训练",completed:"已完成",template:"训练模板",notes:"备注",url:"教学链接 (https://...)",aliases:"别名（用逗号分隔）",add:"添加",noTutorial:"尚未添加教程链接",restore:"页面刷新后训练进度会保留",muscle:"训练部位",select:"选择动作",moveUp:"上移",moveDown:"下移",editSession:"编辑训练记录",importWarning:"导入会替换本机所有训练数据，确定继续？",invalid:"请输入有效的名称、非负重量和整数次数。教程链接必须为 HTTPS。",sessionName:"训练名称",archiveWarning:"动作归档后仍保留在历史训练中。"},
en:{workout:"Workout",exercises:"Exercises",templates:"Templates",history:"History",settings:"Settings",start:"Start workout",startBlank:"Blank workout",fromTemplate:"Start from template",active:"Active workout",addExercise:"Add exercise",addSet:"Add set",finish:"Finish & save",weight:"Weight kg",reps:"Reps",set:"Set",last:"Last",tutorial:"Tutorial ↗",edit:"Edit",archive:"Archive",newExercise:"New exercise",newTemplate:"New template",name:"Name",search:"Search English, Chinese or alias",group:"Muscle group",all:"All",save:"Save",cancel:"Cancel",delete:"Delete",copy:"Duplicate",none:"No records",empty:"No workouts yet",import:"Import JSON",export:"Export JSON",local:"Data stays in this browser only. Export backups regularly; there is no automatic cross-device sync.",notFound:"Exercise not found",custom:"Custom workout",confirmDelete:"Delete this record?",discard:"Discard workout",continue:"Continue workout",completed:"Completed",template:"Workout template",notes:"Notes",url:"Tutorial URL (https://...)",aliases:"Aliases (comma-separated)",add:"Add",noTutorial:"No tutorial URL yet",restore:"Your active workout survives refresh",muscle:"Muscle",select:"Choose exercise",moveUp:"Move up",moveDown:"Move down",editSession:"Edit history",importWarning:"Import replaces all records in this browser. Continue?",invalid:"Use names, nonnegative weights and integer reps. Tutorial links must use HTTPS.",sessionName:"Workout name",archiveWarning:"Archived exercises remain in workout history."}};
const groups={legs:["Legs","腿部"],glutes:["Glutes","臀部"],back:["Back","背部"],chest:["Chest","胸部"],shoulders:["Shoulders","肩部"],arms:["Arms","手臂"],core:["Core","核心"]};
let db=load(),tab="workout",filter="",groupFilter="",editingExercise=null,editingTemplate=null,viewSession=null,editingHistory=false,chooseFor=null;
function fresh(){return{version:1,lang:"zh",exercises:seed,templates:[{id:"tpl-legs",name:"Lower Body / 下肢",exercise_ids:["seed-1","seed-0","seed-2","seed-4"]},{id:"tpl-back",name:"Back & Arms / 背部手臂",exercise_ids:["seed-12","seed-13","seed-16","seed-22"]}],sessions:[],draft:null};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.exercises)&&Array.isArray(x.templates)&&Array.isArray(x.sessions))return x}catch(e){}return fresh()}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert("Storage failed: "+e.message)}}
function uid(){return crypto&&crypto.randomUUID?crypto.randomUUID():"id-"+Date.now()+"-"+Math.random().toString(16).slice(2)}
function t(k){return dict[db.lang][k]||k}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function ex(id){return db.exercises.find(e=>e.id===id)}
function nm(e){return e?(db.lang==="zh"?e.name_zh:e.name_en):t("notFound")}
function grp(g){return groups[g]?(db.lang==="zh"?groups[g][1]:groups[g][0]):g}
function b(label,act,cls=""){return '<button type="button" class="btn '+cls+'" onclick="'+act+'">'+esc(label)+'</button>'}
function nav(){document.documentElement.lang=db.lang==="zh"?"zh-CN":"en";document.getElementById("zh").classList.toggle("on",db.lang==="zh");document.getElementById("en").classList.toggle("on",db.lang==="en");document.getElementById("nav").innerHTML=["workout","exercises","templates","history","settings"].map(k=>'<button class="'+(tab===k?"on":"")+'" onclick="go(\''+k+'\')">'+t(k)+'</button>').join("")}
function switchLang(l){db.lang=l;persist();render()}
function go(k){tab=k;filter="";groupFilter="";editingExercise=null;editingTemplate=null;viewSession=null;editingHistory=false;render()}
function setFilter(s){filter=s;render();const el=document.getElementById("search");if(el){el.focus();el.setSelectionRange(s.length,s.length)}}
function getFiltered(){const q=filter.trim().toLocaleLowerCase();return db.exercises.filter(e=>!e.archived&&(!groupFilter||groupFilter===e.muscle_group)&&(!q||[e.name_en,e.name_zh,...(e.aliases||[])].join(" ").toLocaleLowerCase().includes(q)))}
function lastFor(id){for(const s of [...db.sessions].sort((a,b)=>b.started_at.localeCompare(a.started_at))){let x=s.exercises.find(e=>e.exercise_id===id);if(x&&x.sets.length)return x.sets.filter(z=>z.completed).at(-1)||x.sets.at(-1)}return null}
function date(s){return new Date(s).toLocaleDateString(db.lang==="zh"?"zh-CN":"en-CA",{year:"numeric",month:"short",day:"numeric"})}
function field(label,id,val,type="text"){return '<label class="field"><span>'+esc(label)+'</span><input class="input" id="'+id+'" type="'+type+'" value="'+esc(val||"")+'"></label>'}
function getval(id){return document.getElementById(id).value.trim()}
function render(){nav();document.getElementById("bottom").classList.add("hide");document.getElementById("app").innerHTML=tab==="workout"?renderWorkout():tab==="exercises"?renderExercises():tab==="templates"?renderTemplates():tab==="history"?renderHistory():renderSettings();if(tab==="workout"&&db.draft){const footer=document.getElementById("bottom");footer.classList.remove("hide");const btn=document.getElementById("saveworkout");btn.textContent=t("finish");btn.onclick=finishWorkout}}
function renderWorkout(){if(!db.draft)return '<h1>'+t("workout")+'</h1><div class="card"><h2>'+t("start")+'</h2>'+b(t("startBlank"),"startWorkout(null)","primary")+'<hr class="line"><div class="muted">'+t("fromTemplate")+'</div><div class="spacer"></div>'+db.templates.map(x=>'<div class="row wrap" style="margin-bottom:10px"><strong>'+esc(x.name)+'</strong>'+b(t("start"),"startWorkout('"+x.id+"')","small")+'</div>').join("")+'</div>';let s=db.draft;return '<div class="row"><h1>'+t("active")+'</h1>'+b(t("discard"),"discardWorkout()","danger small")+'</div><div class="card">'+field(t("sessionName"),"draftname",s.name)+'<label class="field"><span>'+t("notes")+'</span><textarea id="draftnotes" oninput="changeDraftMeta()">'+esc(s.notes||"")+'</textarea></label><div class="muted">'+date(s.started_at)+' · '+t("restore")+'</div></div>'+s.exercises.map((item,i)=>renderWorkoutExercise(item,i)).join("")+'<div class="card">'+b(t("addExercise"),"pickExercise('draft')","soft")+'</div>'}
function renderWorkoutExercise(item,i){const e=ex(item.exercise_id),prev=lastFor(item.exercise_id);let h='<div class="card"><div class="row wrap"><div class="grow"><div class="exercise-title">'+esc(nm(e))+'</div><span class="muted">'+esc(e?grp(e.muscle_group):"")+'</span>'+(prev?'<div class="tiny muted">'+t("last")+': '+prev.weight_kg+' kg × '+prev.reps+'</div>':"")+'</div><div class="buttons">'+(e&&e.tutorial_url?b(t("tutorial"),"openTutorial('"+e.id+"')","small"):"")+b("×","removeDraftExercise("+i+")","small danger")+'</div></div><div class="sethead"><span>'+t("set")+'</span><span>'+t("weight")+'</span><span>'+t("reps")+'</span><span>✓</span><span></span></div>';h+=item.sets.map((z,j)=>'<div class="setrow '+(z.completed?"done":"")+'"><span style="text-align:center">'+(j+1)+'</span><input class="input" aria-label="kg" type="number" min="0" step="any" value="'+esc(z.weight_kg)+'" onchange="changeSet('+i+','+j+',\'weight_kg\',this.value)"><input class="input" aria-label="reps" type="number" min="0" step="1" value="'+esc(z.reps)+'" onchange="changeSet('+i+','+j+',\'reps\',this.value)"><button class="circle" onclick="toggleSet('+i+','+j+')" aria-label="Complete">'+(z.completed?"●":"○")+'</button><button class="remove" onclick="removeSet('+i+','+j+')" aria-label="Remove">×</button></div>').join("");return h+b("+ "+t("addSet"),"addSet("+i+")","soft small")+'</div>'}
function changeDraftMeta(){if(!db.draft)return;db.draft.notes=document.getElementById("draftnotes").value;persist()}
function draftName(){const x=document.getElementById("draftname");if(x&&db.draft)db.draft.name=x.value.trim()||t("custom")}
function startWorkout(id){const tp=id?db.templates.find(x=>x.id===id):null;db.draft={id:uid(),template_id:tp?tp.id:null,name:tp?tp.name:t("custom"),started_at:new Date().toISOString(),notes:"",exercises:(tp?tp.exercise_ids:[]).map(id=>({exercise_id:id,sets:[initialSet(id)]}))};persist();render()}
function initialSet(id){const z=lastFor(id);return{id:uid(),weight_kg:z?z.weight_kg:0,reps:z?z.reps:10,completed:false}}
function discardWorkout(){if(confirm(t("discard")+"?")){db.draft=null;persist();render()}}
function addSet(i){draftName();let a=db.draft.exercises[i].sets;const p=a.length?a[a.length-1]:initialSet(db.draft.exercises[i].exercise_id);a.push({id:uid(),weight_kg:p.weight_kg,reps:p.reps,completed:false});persist();render()}
function changeSet(i,j,k,v){const n=Number(v);if(!Number.isFinite(n)||n<0||(k==="reps"&&!Number.isInteger(n))){alert(t("invalid"));render();return}db.draft.exercises[i].sets[j][k]=n;persist()}
function toggleSet(i,j){draftName();db.draft.exercises[i].sets[j].completed=!db.draft.exercises[i].sets[j].completed;persist();render()}
function removeSet(i,j){draftName();db.draft.exercises[i].sets.splice(j,1);persist();render()}
function removeDraftExercise(i){draftName();db.draft.exercises.splice(i,1);persist();render()}
function validSession(s){return s.exercises.every(x=>x.sets.every(z=>Number.isFinite(Number(z.weight_kg))&&Number(z.weight_kg)>=0&&Number.isInteger(Number(z.reps))&&Number(z.reps)>=0))}
function finishWorkout(){draftName();const s=db.draft;if(!s||!s.exercises.length||!validSession(s)){alert(t("invalid"));return}if(!s.exercises.some(e=>e.sets.some(z=>z.completed))){alert(db.lang==="zh"?"至少完成一组训练":"Complete at least one set");return}s.completed_at=new Date().toISOString();db.sessions.push(structuredClone(s));db.draft=null;persist();tab="history";viewSession=s.id;render()}
function pickExercise(where){chooseFor=where;tab="exercises";editingExercise=null;filter="";render()}
function appendExercise(id){if(chooseFor==="draft"&&db.draft){draftName();db.draft.exercises.push({exercise_id:id,sets:[initialSet(id)]});persist();chooseFor=null;tab="workout"}else if(chooseFor==="template"&&editingTemplate){editingTemplate.exercise_ids.push(id);chooseFor=null;tab="templates"}render()}
function openTutorial(id){const e=ex(id);if(e&&/^https:\/\//i.test(e.tutorial_url||""))window.open(e.tutorial_url,"_blank","noopener,noreferrer")}
function renderExercises(){let title='<div class="row wrap"><h1>'+t("exercises")+'</h1>'+b("+ "+t("newExercise"),"editExercise(null)","primary small")+'</div>';if(editingExercise!==null)return title+renderExerciseForm();let list=getFiltered();let h=title+'<div class="card">'+field(t("search"),"search",filter).replace('id="search"','id="search" oninput="setFilter(this.value)"')+'<label class="field"><span>'+t("group")+'</span><select id="gf" onchange="groupFilter=this.value;render()"><option value="">'+t("all")+'</option>'+Object.keys(groups).map(g=>'<option value="'+g+'" '+(g===groupFilter?"selected":"")+'>'+grp(g)+'</option>').join("")+'</select></label></div>';if(chooseFor)h+='<div class="muted" style="margin-bottom:10px">'+t("select")+'</div>';return h+(list.length?list.map(e=>'<div class="card"><div class="row"><div class="grow"><strong>'+esc(nm(e))+'</strong><div class="muted">'+esc(db.lang==="zh"?e.name_en:e.name_zh)+' · '+esc(grp(e.muscle_group))+'</div></div><div class="buttons">'+(chooseFor?b("+ "+t("add"),"appendExercise('"+e.id+"')","primary small"):b(t("edit"),"editExercise('"+e.id+"')","small"))+(e.tutorial_url?b(t("tutorial"),"openTutorial('"+e.id+"')","small"):"")+'</div></div></div>').join(""):'<div class="empty">'+t("none")+'</div>')+(chooseFor?b(t("cancel"),"cancelPick()","small"):"")}
function cancelPick(){tab=chooseFor==="draft"?"workout":"templates";chooseFor=null;render()}
function editExercise(id){editingExercise=id||"new";render()}
function renderExerciseForm(){const e=editingExercise==="new"?{}:ex(editingExercise)||{};return '<div class="card"><h2>'+t("newExercise")+'</h2><div class="split">'+field("English","exen",e.name_en)+field("中文","exzh",e.name_zh)+'</div>'+field(t("aliases"),"exalias",(e.aliases||[]).join(", "))+'<label class="field"><span>'+t("muscle")+'</span><select id="exgroup">'+Object.keys(groups).map(g=>'<option value="'+g+'" '+(g===e.muscle_group?"selected":"")+'>'+grp(g)+'</option>').join("")+'</select></label>'+field(t("url"),"exurl",e.tutorial_url)+field(t("notes"),"exnotes",e.notes)+'<div class="buttons">'+b(t("save"),"saveExercise()","primary")+b(t("cancel"),"editingExercise=null;render()")+(editingExercise!=="new"?b(t("archive"),"archiveExercise()","danger"):"")+'</div></div>'}
function saveExercise(){let en=getval("exen"),zh=getval("exzh"),url=getval("exurl");if(!en||!zh||(url&&!/^https:\/\/[^ ]+$/i.test(url))){alert(t("invalid"));return}let e=editingExercise==="new"?{id:uid(),archived:false}:ex(editingExercise);if(!e)return;Object.assign(e,{name_en:en,name_zh:zh,aliases:getval("exalias").split(",").map(x=>x.trim()).filter(Boolean),muscle_group:getval("exgroup"),tutorial_url:url,notes:getval("exnotes")});if(editingExercise==="new")db.exercises.push(e);editingExercise=null;persist();render()}
function archiveExercise(){if(confirm(t("archiveWarning"))){let e=ex(editingExercise);e.archived=true;editingExercise=null;persist();render()}}
function renderTemplates(){if(editingTemplate)return renderTemplateForm();return '<div class="row wrap"><h1>'+t("templates")+'</h1>'+b("+ "+t("newTemplate"),"editTemplate(null)","primary small")+'</div>'+db.templates.map(tp=>'<div class="card"><div class="row wrap"><div><h3>'+esc(tp.name)+'</h3><div class="muted">'+tp.exercise_ids.map(id=>nm(ex(id))).join(" · ")+'</div></div><div class="buttons">'+b(t("start"),"startFromTemplate('"+tp.id+"')","primary small")+b(t("edit"),"editTemplate('"+tp.id+"')","small")+b(t("copy"),"duplicateTemplate('"+tp.id+"')","small")+b(t("delete"),"deleteTemplate('"+tp.id+"')","danger small")+'</div></div></div>').join("")}
function startFromTemplate(id){tab="workout";startWorkout(id)}
function editTemplate(id){const src=db.templates.find(t=>t.id===id);editingTemplate=src?structuredClone(src):{id:uid(),name:"",exercise_ids:[]};render()}
function renderTemplateForm(){const tp=editingTemplate;return '<h1>'+t("template")+'</h1><div class="card">'+field(t("name"),"tpname",tp.name)+'<div class="spacer"></div>'+tp.exercise_ids.map((id,i)=>'<div class="row" style="margin:8px 0"><span>'+esc(nm(ex(id)))+'</span><div class="buttons">'+b("↑","shiftTemplate("+i+",-1)","small")+b("↓","shiftTemplate("+i+",1)","small")+b("×","dropTemplate("+i+")","danger small")+'</div></div>').join("")+'<div class="spacer"></div><div class="buttons">'+b("+ "+t("addExercise"),"pickExercise('template')","soft")+b(t("save"),"saveTemplate()","primary")+b(t("cancel"),"editingTemplate=null;render()")+'</div></div>'}
function shiftTemplate(i,d){let a=editingTemplate.exercise_ids,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];render()}
function dropTemplate(i){editingTemplate.exercise_ids.splice(i,1);render()}
function saveTemplate(){let name=getval("tpname");if(!name){alert(t("invalid"));return}editingTemplate.name=name;let i=db.templates.findIndex(x=>x.id===editingTemplate.id);if(i>=0)db.templates[i]=editingTemplate;else db.templates.push(editingTemplate);editingTemplate=null;persist();render()}
function duplicateTemplate(id){let s=db.templates.find(x=>x.id===id);db.templates.push({...structuredClone(s),id:uid(),name:s.name+" copy"});persist();render()}
function deleteTemplate(id){if(confirm(t("confirmDelete"))){db.templates=db.templates.filter(x=>x.id!==id);persist();render()}}
function renderHistory(){if(viewSession){const s=db.sessions.find(x=>x.id===viewSession);if(!s){viewSession=null;return renderHistory()}if(editingHistory)return renderHistoryEdit(s);return '<div class="row wrap"><h1>'+esc(s.name)+'</h1>'+b("← "+t("history"),"viewSession=null;render()","small")+'</div><p class="muted">'+date(s.started_at)+'</p>'+s.exercises.map(x=>'<div class="card"><strong>'+esc(nm(ex(x.exercise_id)))+'</strong><div class="historyset">'+x.sets.map((z,j)=>(j+1)+'. '+z.weight_kg+' kg × '+z.reps+(z.completed?" ✓":"")).join("<br>")+'</div></div>').join("")+'<div class="card"><div class="muted">'+esc(s.notes||"")+'</div><div class="spacer"></div><div class="buttons">'+b(t("edit"),"editingHistory=true;render()","primary")+b(t("delete"),"deleteSession('"+s.id+"')","danger")+'</div></div>'}return '<h1>'+t("history")+'</h1>'+(db.sessions.length?db.sessions.slice().sort((a,b)=>b.started_at.localeCompare(a.started_at)).map(s=>'<div class="card row"><div><strong>'+esc(s.name)+'</strong><div class="muted">'+date(s.started_at)+' · '+s.exercises.length+' '+t("exercises")+'</div></div>'+b("→","viewSession='"+s.id+"';render()","small")+'</div>').join(""):'<div class="card empty">'+t("empty")+'</div>')}
function renderHistoryEdit(s){return '<h1>'+t("editSession")+'</h1><div class="card">'+field(t("name"),"histname",s.name)+'<label class="field"><span>'+t("notes")+'</span><textarea id="histnotes">'+esc(s.notes||"")+'</textarea></label></div>'+s.exercises.map((x,i)=>'<div class="card"><strong>'+esc(nm(ex(x.exercise_id)))+'</strong>'+x.sets.map((z,j)=>'<div class="three" style="margin:8px 0"><label class="field"><span>kg</span><input class="input" type="number" step="any" min="0" id="hw-'+i+'-'+j+'" value="'+z.weight_kg+'"></label><label class="field"><span>'+t("reps")+'</span><input class="input" type="number" step="1" min="0" id="hr-'+i+'-'+j+'" value="'+z.reps+'"></label><label class="field"><span>✓</span><select id="hc-'+i+'-'+j+'"><option value="yes" '+(z.completed?"selected":"")+'>✓</option><option value="no" '+(!z.completed?"selected":"")+'>○</option></select></label></div>').join("")+'</div>').join("")+'<div class="buttons">'+b(t("save"),"saveHistory()","primary")+b(t("cancel"),"editingHistory=false;render()")+'</div>'}
function saveHistory(){const s=db.sessions.find(x=>x.id===viewSession),n=getval("histname");if(!n){alert(t("invalid"));return}let update=[];for(let i=0;i<s.exercises.length;i++)for(let j=0;j<s.exercises[i].sets.length;j++){let w=Number(getval("hw-"+i+"-"+j)),r=Number(getval("hr-"+i+"-"+j));if(!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<0){alert(t("invalid"));return}update.push([i,j,w,r,getval("hc-"+i+"-"+j)==="yes"])}s.name=n;s.notes=getval("histnotes");for(const [i,j,w,r,c]of update)Object.assign(s.exercises[i].sets[j],{weight_kg:w,reps:r,completed:c});editingHistory=false;persist();render()}
function deleteSession(id){if(confirm(t("confirmDelete"))){db.sessions=db.sessions.filter(x=>x.id!==id);viewSession=null;persist();render()}}
function renderSettings(){return '<h1>'+t("settings")+'</h1><div class="card"><h2>'+t("export")+' / '+t("import")+'</h2><p class="muted">'+t("local")+'</p><div class="buttons">'+b(t("export"),"exportData()","primary")+b(t("import"),"document.getElementById('importFile').click()")+'</div><p class="help">JSON · localStorage · No cloud sync</p></div>'}
function exportData(){const a=document.createElement("a"),url=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.href=url;a.download="workout-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
document.getElementById("importFile").addEventListener("change",async function(){const f=this.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.exercises)||!Array.isArray(x.templates)||!Array.isArray(x.sessions)||!["zh","en"].includes(x.lang))throw Error("Invalid data");if(confirm(t("importWarning"))){db=x;persist();go("workout")}}catch(e){alert("Invalid backup JSON: "+e.message)}this.value=""});
document.getElementById("app").addEventListener("input",e=>{if(e.target.id==="draftname"&&db.draft){db.draft.name=e.target.value;persist()}});
render();
</script></body></html>
